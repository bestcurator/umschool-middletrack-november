$('#modalBody').innerHTML=`<div class="stats"><div class="stat"><span class="stat-emoji">🎬</span><span class="stat-label">Вебинары</span><strong>${d.seen}<small> / ${d.available}</small></strong><div class="bar" style="--v:${d.percent}%"><i></i></div></div><div class="stat"><span class="stat-emoji">${up?'📈':'📉'}</span><span class="stat-label">Средний балл ДЗ</span><strong>${fmt(d.avg)}</strong>${comparable?`<span class="delta ${up?'':'down'}">${up?'↗ +':'↘ '}${fmt(delta)} с октября</span>`:d.avg===null?'<span class="delta">Пока нет оценок</span>':''}</div><div class="stat debt-stat ${d.debt?'has-debt':'all-done'}"><span class="stat-emoji">${d.debt?'📝':'✅'}</span><span class="stat-label">Несданные ДЗ</span><strong>${d.debt}</strong></div></div><div class="exam-highlight"><span class="emoji">${i<2?'🎯':'📝'}</span><p>${ex}</p></div><div class="tabs" role="tablist" aria-label="Результаты"><button role="tab" id="tab-best" aria-controls="tabContent" aria-selected="true" data-tab="best">🏆 Лучшие работы</button><button role="tab" id="tab-focus" aria-controls="tabContent" aria-selected="false" data-tab="focus">📝 Другие работы</button><button role="tab" id="tab-exams" aria-controls="tabContent" aria-selected="false" data-tab="exams">🎯 Пробники</button></div><div id="tabContent" class="tab-content" role="tabpanel" aria-labelledby="tab-best"></div>`;
let selected='',tabRevision=0;function tab(k,immediate=false){if(k===selected)return;selected=k;const revision=++tabRevision;clearTimeout(tabTimer);$$('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tab===k));b.tabIndex=b.dataset.tab===k?0:-1});const content=$('#tabContent');function paint(){if(revision!==tabRevision)return;content.setAttribute('aria-labelledby','tab-'+k);content.innerHTML=d[k].map(work).join('')+(k==='exams'&&OLD[i]?work({title:'Октябрьский пробник',url:'https://nd.umschool.net/homework/'+OLD[i]},d[k].length):'');if(!content.innerHTML)content.innerHTML='<p class="empty-state">'+(k==='best'?'Пока нет проверенных работ':k==='focus'?(d.best.length?'Других работ пока нет':'Пока нет проверенных работ'):'Пробников пока нет')+'</p>';content.classList.remove('tab-exit');content.classList.remove('tab-enter');void content.offsetWidth;content.classList.add('tab-enter')}if(immediate||reduce)paint();else{content.classList.remove('tab-enter');content.classList.add('tab-exit');tabTimer=setTimeout(paint,140)}}
$$('[data-tab]').forEach((b,n)=>{b.onclick=()=>tab(b.dataset.tab);b.onkeydown=e=>{const list=$$('[data-tab]');let j;if(e.key==='ArrowRight')j=(n+1)%3;if(e.key==='ArrowLeft')j=(n+2)%3;if(e.key==='Home')j=0;if(e.key==='End')j=2;if(j!==undefined){e.preventDefault();tab(list[j].dataset.tab);list[j].focus()}}});$('#modalActions').innerHTML=`<button id="continue" class="gold-button">${i===completed?'Закрыть и продолжить →':'Вернуться на карту →'}</button>`;$('#continue').onclick=()=>closeModal();tab('best',true);openModal(d.name,EMOJI[i])}
function finale(){$('#modalBody').innerHTML=`<div class="final-letter"><p>Саша, в ноябре у тебя <mark class="text-highlight">работы на 100 по всем четырём предметам</mark> 🔥 По информатике просмотрены все 10 вебинаров, средний балл вырос с 84 до 91, а пробник уже на проверке — ждём результат!</p><p>По русскому средний балл поднялся с 89 до 95,6 — сочинение и задание №17 на 100! По математике и физике результаты в целом близки к октябрьским, но есть темы, которые стоит закрепить</p><p>По математике обрати внимание на вторую практику задания №17, а по физике — на равновесие тел и блоки — здесь пока 62 и 56 баллов</p><p>До конца месяца давай постараемся закрыть оставшиеся домашки, особенно <strong>пять работ по математике</strong>, и постепенно написать пробники по остальным предметам — хочется, чтобы практика успевала за просмотренными вебинарами</p><p>Если где-то застрянешь, пиши — разберёмся вместе ✨</p><p class="signature"><em>Твой старший куратор Егор ✨</em></p><div class="secret-word"><span class="secret-icon" aria-hidden="true">✉️</span><div><p>Кодовое слово</p><strong>КАШТАН</strong></div></div></div>`;$('#modalActions').innerHTML='<span class="finished-label">Прогулка завершена ✓</span><button class="gold-button" id="finish">На карту →</button>';$('#finish').onclick=()=>closeModal();openModal('Саша, удачи во второй половине ноября!','🍂',true)}
$('#close').onclick=()=>closeModal();$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});$('#modal').addEventListener('close',()=>{clearTimeout(tabTimer);update();$('#next').focus({preventScroll:true})});$('#modal').addEventListener('click',e=>{if(e.target!==$('#modal'))return;const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const map=$('#map');if(map.clientWidth===mapW&&map.clientHeight===mapH)return;const travelling=busy;if(travelling)cancelAnimationFrame(animation);renderMap();if(travelling)arrive(active);else if(active>=0){currentPoint=points[active];positionMarker(currentPoint)}},180)});
renderMap();update();

// Short-lived sparkles stay in the dialog's top layer when a card is open
function tapSparkles(button,event){if(reduce)return;const r=button.getBoundingClientRect(),x=event.clientX>0?event.clientX:r.left+r.width/2,y=event.clientY>0?event.clientY:r.top+r.height/2,layer=document.createElement('div');layer.className='tap-effects';layer.setAttribute('aria-hidden','true');const count=mobile?6:12;for(let i=0;i<count;i++){const s=document.createElement('i'),angle=Math.PI*2*i/count+Math.random()*.4,distance=25+Math.random()*60;s.className=i%3?'tap-spark':'tap-star';s.style.cssText='left:'+x+'px;top:'+y+'px;--dx:'+Math.cos(angle)*distance+'px;--dy:'+Math.sin(angle)*distance+'px;--twist:'+(Math.random()*180)+'deg;--spark-size:'+(3+Math.random()*5)+'px;animation-delay:'+Math.random()*45+'ms';layer.append(s)}const ring=document.createElement('i');ring.className='tap-ring';ring.style.cssText='left:'+x+'px;top:'+y+'px';layer.append(ring);($('#modal').open?$('#modal'):document.body).append(layer);button.classList.remove('tap-glow');void button.offsetWidth;button.classList.add('tap-glow');setTimeout(()=>{layer.remove();button.classList.remove('tap-glow')},1000)}
document.addEventListener('click',event=>{const button=event.target.closest?.('button,a');if(button&&!button.disabled)tapSparkles(button,event)});
</script></body></html>
